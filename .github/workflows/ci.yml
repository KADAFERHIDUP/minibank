name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build dan test (unit + integrasi dengan PostgreSQL via Testcontainers)
        run: mvn -B -ntp verify
      - name: Simpan laporan test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image Docker
        run: docker build -t minibank:ci .
      - name: Smoke test dengan PostgreSQL
        run: |
          docker network create mb
          docker run -d --name db --network mb -e POSTGRES_DB=minibank -e POSTGRES_USER=minibank -e POSTGRES_PASSWORD=minibank postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U minibank && break; sleep 1; done
          docker run -d --name api --network mb -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://db:5432/minibank -e JWT_SECRET=rahasia-ci-yang-panjangnya-lebih-dari-32-karakter \
            -e ADMIN_EMAIL=teller@minibank.local -e ADMIN_PASSWORD=Teller12345 minibank:ci
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health && break; sleep 2; done
          curl -fs localhost:8080/actuator/health | grep UP
          curl -fs localhost:8080/v3/api-docs > /dev/null
          curl -fs localhost:8080/ | grep -q "js/app.js"
          curl -fs localhost:8080/js/app.js > /dev/null
          curl -fs localhost:8080/css/app.css > /dev/null
          curl -fs -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"teller@minibank.local","password":"Teller12345"}' | grep accessToken
      - name: Log aplikasi kalau gagal
        if: failure()
        run: docker logs api || true
