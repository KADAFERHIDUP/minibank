# Untuk mencoba di laptop: docker compose up --build
# Nilai di bawah hanya untuk lokal. Jangan dipakai di server sungguhan.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: minibank
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/minibank
      DB_USER: minibank
      DB_PASSWORD: minibank
      JWT_SECRET: ganti-dengan-rahasia-acak-minimal-32-karakter
      ADMIN_EMAIL: teller@minibank.local
      ADMIN_PASSWORD: Teller12345
    ports:
      - "8080:8080"

volumes:
  dbdata:
